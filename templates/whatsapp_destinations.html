<fieldset class="wa-destinations">
 <legend>Enviar também para o WhatsApp</legend>
 <p>Selecione até 5 grupos da sua conta conectada. O destino do Telegram continua ativo.</p>
 <button type="button" class="mini-btn" data-wa-load="{{ wa_scope }}">Carregar meus grupos</button>
 <div id="{{ wa_scope }}WhatsAppOptions" class="wa-options" role="group" aria-label="Grupos de destino do WhatsApp"><p class="wa-muted">Conecte sua conta na aba WhatsApp e carregue os grupos aqui. Nenhum envio para WhatsApp está selecionado.</p></div>
 <p id="{{ wa_scope }}WhatsAppError" class="wa-error" role="alert" hidden></p>
</fieldset>
